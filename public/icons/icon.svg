<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="180" fill="#0f172a" fill-opacity="0.3" stroke="url(#glow)" stroke-width="8" />
  <!-- Robot/AI Assistant Icon -->
  <g transform="translate(136, 136)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenna -->
    <line x1="120" y1="20" x2="120" y2="60" />
    <circle cx="120" cy="15" r="10" fill="#60a5fa" stroke="#ffffff" stroke-width="6" />
    <!-- Head -->
    <rect x="30" y="60" width="180" height="130" rx="30" fill="#ffffff" fill-opacity="0.1" />
    <!-- Eyes -->
    <circle cx="80" cy="115" r="14" fill="#38bdf8" />
    <circle cx="160" cy="115" r="14" fill="#38bdf8" />
    <!-- Smile -->
    <path d="M 85 155 Q 120 180 155 155" stroke="#38bdf8" stroke-width="12" />
    <!-- Ears -->
    <rect x="10" y="100" width="15" height="40" rx="6" fill="#60a5fa" />
    <rect x="215" y="100" width="15" height="40" rx="6" fill="#60a5fa" />
  </g>
  <!-- Sparkles / Broadcast waves -->
  <path d="M 370 120 A 40 40 0 0 1 410 160" fill="none" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" />
  <path d="M 390 100 A 70 70 0 0 1 460 170" fill="none" stroke="#bfdbfe" stroke-width="12" stroke-linecap="round" />
</svg>
